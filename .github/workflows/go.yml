name: Go

on: [push, pull_request]

env:
  GOTOOLCHAIN: local
  TEST_DSN: postgresql://whatsmeow_test:whatsmeow_test@localhost:5432/whatsmeow_test?sslmode=disable

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.26", "1.27"]
    name: Build ${{ matrix.go-version == '1.27' && '(latest)' || '(old)' }}

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: whatsmeow_test
          POSTGRES_PASSWORD: whatsmeow_test
          POSTGRES_DB: whatsmeow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U whatsmeow_test"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 10

    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: ${{ matrix.go-version }}

    - name: Build
      run: go build -v ./...

    - name: Test
      env:
        PGPASSWORD: whatsmeow_test
      run: |
        psql -h localhost -U whatsmeow_test -d whatsmeow_test -v ON_ERROR_STOP=1 \
          -f store/sqlstore/upgrades/00-latest-schema.sql
        go test -v -count=1 -p 1 ./...

    - name: Race tests
      if: matrix.go-version == '1.27'
      run: go test -race -count=1 -p 1 . ./socket ./store ./store/sqlstore

    - name: Install dependencies
      run: |
        go install golang.org/x/tools/cmd/goimports@latest
        go install honnef.co/go/tools/cmd/staticcheck@latest
        export PATH="$HOME/go/bin:$PATH"

    - name: Run pre-commit
      uses: pre-commit/action@v3.0.1
      env:
        # go 1.26's formatter doesn't agree with 1.27 on some things
        SKIP: ${{ matrix.go-version == '1.26' && 'go-imports-repo' || '' }}
